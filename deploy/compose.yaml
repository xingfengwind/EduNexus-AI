name: edunexus
services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: edunexus
      MYSQL_USER: edunexus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4.8
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 6
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.76
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
    volumes: [rustfs-data:/data]
volumes:
  mysql-data:
  redis-data:
  rustfs-data:
