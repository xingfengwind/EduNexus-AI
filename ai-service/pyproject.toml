[project]
name = "edunexus-ai"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "jsonschema>=4.23,<5"]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "boto3>=1.43.126",
    "pyyaml>=6.0.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
